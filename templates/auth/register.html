{% extends "layout.html" %}

{% block title %}Create account · FerroBank{% endblock %}

{% block content %}
<section class="max-w-sm mx-auto py-10">
  <h1 class="text-2xl font-semibold text-stone-900">Create an account</h1>
  <p class="mt-2 text-sm text-stone-600">Open a FerroBank account in under a minute.</p>

  {% if let Some(msg) = error %}
    <div class="mt-6 p-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-800">
      {{ msg }}
    </div>
  {% endif %}

  <form action="/register" method="POST" class="mt-6 space-y-4">
    <div>
      <label for="full_name" class="block text-sm font-medium text-stone-700">Full name</label>
      <input
        type="text"
        id="full_name"
        name="full_name"
        value="{{ full_name }}"
        required
        autocomplete="name"
        autofocus
        minlength="2"
        maxlength="80"
        class="mt-1 w-full px-3 py-2 rounded-md border border-stone-300 bg-white focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700">
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-stone-700">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        value="{{ email }}"
        required
        autocomplete="email"
        class="mt-1 w-full px-3 py-2 rounded-md border border-stone-300 bg-white focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-stone-700">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="new-password"
        minlength="8"
        maxlength="128"
        class="mt-1 w-full px-3 py-2 rounded-md border border-stone-300 bg-white focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700">
      <p class="mt-1 text-xs text-stone-500">At least 8 characters.</p>
    </div>

    <button
      type="submit"
      class="w-full px-4 py-2.5 rounded-md bg-amber-700 text-white font-medium hover:bg-amber-800 transition">
      Create account
    </button>
  </form>

  <p class="mt-6 text-sm text-stone-600 text-center">
    Already have an account?
    <a href="/login" class="text-amber-700 hover:underline">Sign in</a>
  </p>
</section>
{% endblock %}
