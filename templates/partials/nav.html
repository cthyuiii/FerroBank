<header class="bg-white border-b border-stone-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between gap-6">
    <a href="/" class="flex items-center gap-2 font-semibold tracking-tight text-stone-900">
      <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-amber-700 text-white text-xs font-bold">F</span>
      FerroBank
    </a>

    <nav class="hidden md:flex items-center gap-6 text-sm text-stone-700">
      {% if let Some(u) = layout.user %}
        <a href="/accounts" class="hover:text-amber-700 transition">Accounts</a>
        <a href="/transfers" class="hover:text-amber-700 transition">Transfers</a>
        <a href="/loans" class="hover:text-amber-700 transition">Loans</a>
        {% if u.role == "admin" %}
          <a href="/admin/dashboard" class="hover:text-amber-700 transition">Admin</a>
        {% endif %}
      {% endif %}
    </nav>

    <div class="flex items-center gap-3 text-sm">
      <button
        type="button"
        onclick="fbToggleTheme()"
        aria-label="Toggle light and dark mode"
        title="Toggle theme"
        class="inline-flex items-center justify-center w-9 h-9 rounded-md border border-stone-200 text-stone-600 hover:text-amber-700 hover:border-stone-300 transition">
        <svg class="fb-icon-moon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="fb-icon-sun w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      {% if let Some(u) = layout.user %}
        <span class="hidden sm:inline text-stone-500">{{ u.email }}</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-stone-100 text-stone-700 border border-stone-200 capitalize">{{ u.role }}</span>
        <form action="/logout" method="POST" class="inline">
          <button type="submit" class="text-stone-500 hover:text-amber-700 transition">Sign out</button>
        </form>
      {% else %}
        <a href="/login" class="text-stone-700 hover:text-amber-700 transition">Sign in</a>
        <a href="/register" class="px-3 py-1.5 rounded-md bg-amber-700 text-white text-sm font-medium hover:bg-amber-800 transition">Get started</a>
      {% endif %}
    </div>
  </div>
</header>
