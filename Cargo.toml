[package]
name = "ferrobank"
version = "0.1.0"
edition = "2021"
authors = ["FerroBank Team"]
description = "Iron-clad core banking, built in Rust"
license = "MIT"
# The crate ships two binaries (the server `ferrobank` and the `seed` tool), so
# tell cargo which one plain `cargo run` should launch.
default-run = "ferrobank"

[dependencies]
# Web framework
actix-web = "4.4"
actix-session = { version = "0.9", features = ["cookie-session"] }
actix-files = "0.6"
actix-web-lab = "0.20"

# Templating (server-side rendering)
askama = { version = "0.12", features = ["with-actix-web"] }
askama_actix = "0.14"

# Database
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "rust_decimal",
    "migrate",
] }

# Money (NEVER use f64 for money)
rust_decimal = { version = "1.33", features = ["serde-with-str", "db-postgres"] }

# Password hashing
argon2 = "0.5"
rand = "0.8"

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Config & serialization
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Form & data validation
validator = { version = "0.16", features = ["derive"] }

# IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
mockall = "0.12"
actix-rt = "2.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
